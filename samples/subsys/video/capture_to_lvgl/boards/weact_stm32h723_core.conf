CONFIG_LOG_BUFFER_SIZE=2048

CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=204800
CONFIG_VIDEO_WIDTH=160
CONFIG_VIDEO_HEIGHT=120
CONFIG_BOOT_DELAY=2000

# OV2640 DCMI delivers high-byte-first RGB565; do not swap again on LVGL flush.
CONFIG_LV_COLOR_16_SWAP=n
